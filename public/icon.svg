<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c1a2e" />
      <stop offset="50%" stop-color="#070f1d" />
      <stop offset="100%" stop-color="#040812" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#79c6ff" />
      <stop offset="100%" stop-color="#4fa7ff" />
    </linearGradient>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#4fa7ff" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Background with App Cockpit Palette -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="#4fa7ff" stroke-width="6" stroke-opacity="0.7"/>

  <!-- Avionics Radar Ring Guidelines (Within 80% Safe Zone) -->
  <circle cx="256" cy="195" r="135" stroke="#4fa7ff" stroke-width="2" stroke-opacity="0.22" fill="none" stroke-dasharray="6 6"/>
  <circle cx="256" cy="195" r="95" stroke="#79c6ff" stroke-width="1.5" stroke-opacity="0.28" fill="none"/>

  <!-- Jet Wings / Aviation Emblem in App Cyan (#4fa7ff - #79c6ff) and White -->
  <g filter="url(#cyanGlow)">
    <path d="M 256,80 L 375,205 L 305,195 L 256,245 L 207,195 L 137,205 Z" 
          fill="url(#cyanGrad)" 
          stroke="#ffffff" 
          stroke-width="4.5" 
          stroke-linejoin="round"/>
  </g>

  <!-- Jet Supersonic Fuselage -->
  <polygon points="256,105 269,215 256,205 243,215" fill="#ffffff" />
  
  <!-- Jet Wingtip Accents -->
  <path d="M 175,200 L 140,235 L 175,225 Z" fill="#79c6ff" opacity="0.9" />
  <path d="M 337,200 L 372,235 L 337,225 Z" fill="#79c6ff" opacity="0.9" />

  <!-- Center Cockpit Gyro Horizon Beacon -->
  <circle cx="256" cy="195" r="6" fill="#ffffff"/>
  <circle cx="256" cy="195" r="14" stroke="#79c6ff" stroke-width="2" fill="none" opacity="0.8"/>

  <!-- Bold "GAME" Title in Matching White & Cyan Glow -->
  <g filter="url(#textGlow)">
    <text x="256" y="365" 
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
          font-weight="900" 
          font-size="82" 
          letter-spacing="8" 
          fill="#ffffff" 
          text-anchor="middle">GAME</text>
  </g>

  <!-- Subtitle with Aviation STE in Cyan Primary Color -->
  <text x="256" y="410" 
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-weight="800" 
        font-size="22" 
        letter-spacing="6" 
        fill="#79c6ff" 
        text-anchor="middle">AVIATION STE</text>

  <!-- Cockpit HUD Tech Dots -->
  <circle cx="105" cy="105" r="5" fill="#4fa7ff" opacity="0.5"/>
  <circle cx="407" cy="105" r="5" fill="#4fa7ff" opacity="0.5"/>
  <circle cx="105" cy="407" r="5" fill="#4fa7ff" opacity="0.5"/>
  <circle cx="407" cy="407" r="5" fill="#4fa7ff" opacity="0.5"/>
</svg>
